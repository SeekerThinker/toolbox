<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Toolbox：PDF、写作、专注与思维工具。" />
  <meta name="theme-color" content="#f5f6f8" />
  <title>Toolbox</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Toolbox 首页">
        <span class="brand-mark">T</span>
        <span class="brand-copy"><strong>Toolbox</strong></span>
      </a>
      <div class="top-actions">
        <button id="recentBtn" class="ghost-btn" type="button">↻ 最近</button>
        <button id="favoritesBtn" class="ghost-btn" type="button">★ 收藏</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">◐</button>
      </div>
    </header>

    <main>
      <section class="tool-finder" aria-label="查找工具">
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索 PDF、番茄钟、复盘、决策、任务拆解…" autocomplete="off" />
          <kbd>/</kbd>
        </div>
        <div id="categoryTabs" class="chips" aria-label="工具分类"></div>
      </section>

      <section class="workspace">
        <div class="section-heading">
          <h2 id="sectionTitle">全部工具</h2>
          <span id="resultCount" class="result-count"></span>
        </div>
        <div id="toolGrid" class="tool-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div>⌕</div>
          <h3>没有找到匹配的工具</h3>
          <p>换个关键词，或切回“全部”。</p>
        </div>
      </section>
    </main>

    <footer>
      <span>Local-first</span>
      <a href="https://github.com/SeekerThinker/toolbox" target="_blank" rel="noreferrer">GitHub ↗</a>
    </footer>
  </div>

  <dialog id="toolDialog">
    <div class="dialog-shell">
      <div class="dialog-head">
        <div>
          <span id="dialogIcon" class="tool-icon"></span>
          <div>
            <div class="dialog-title-row"><h2 id="dialogTitle"></h2><span id="dialogLocalBadge" class="local-badge">本地处理</span></div>
            <p id="dialogDesc"></p>
          </div>
        </div>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="toolMount" class="tool-mount"></div>
    </div>
  </dialog>

  <script defer src="./core.js"></script>
  <script defer src="./tools-pdf.js"></script>
  <script defer src="./tools-focus.js"></script>
  <script defer src="./tools-thinking.js"></script>
  <script defer src="./tools-external.js"></script>
</body>
</html>
