<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Toolbox：一个打开即用的效率与思维工具箱。处理 PDF、图片、文本和数据，也提供专注、任务拆解、决策与复盘工具。" />
  <meta name="theme-color" content="#f5f6fa" />
  <title>Toolbox · 效率与思维工具箱</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./compact.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Toolbox 首页">
        <span class="brand-mark">T</span>
        <span class="brand-copy"><strong>Toolbox</strong></span>
      </a>

      <div class="top-actions">
        <button id="recentBtn" class="ghost-btn" type="button">↻ 最近</button>
        <button id="favoritesBtn" class="ghost-btn" type="button">★ 收藏</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">◐</button>
      </div>
    </header>

    <main>
      <section class="hero compact-hero">
        <div class="hero-heading-row">
          <div>
            <h1>效率与思维工具箱</h1>
            <p class="hero-copy">PDF、图片、文本、计算、数据、专注与思维工具。无需注册，本地优先。</p>
          </div>
          <span id="heroToolCount" class="tool-count-badge">— 个工具</span>
        </div>

        <div class="search-wrap compact-search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索 PDF、OCR、日期、番茄钟、决策、JSON…" autocomplete="off" />
          <kbd>/</kbd>
        </div>

        <div id="categoryTabs" class="chips" aria-label="工具分类"></div>
      </section>

      <section id="tool-library" class="workspace compact-workspace">
        <div class="section-heading compact-heading">
          <h2 id="sectionTitle">全部工具</h2>
          <span id="resultCount" class="result-count"></span>
        </div>

        <div id="toolGrid" class="tool-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div>⌕</div>
          <h3>没有找到匹配的工具</h3>
          <p>换个关键词试试，或者切回“全部”。</p>
        </div>
      </section>
    </main>

    <footer class="compact-footer">
      <span>Toolbox · Local-first</span>
      <a href="https://github.com/SeekerThinker/toolbox" target="_blank" rel="noreferrer">GitHub ↗</a>
    </footer>
  </div>

  <dialog id="toolDialog">
    <div class="dialog-shell">
      <div class="dialog-head">
        <div>
          <span id="dialogIcon" class="tool-icon"></span>
          <div>
            <div class="dialog-title-row"><h2 id="dialogTitle"></h2><span id="dialogLocalBadge" class="local-badge">本地处理</span></div>
            <p id="dialogDesc"></p>
          </div>
        </div>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="toolMount" class="tool-mount"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
  <script src="./v2-core.js"></script>
  <script src="./v2-media.js"></script>
  <script src="./v2-fixes.js"></script>
  <script src="./v3-register.js"></script>
  <script src="./v3-focus.js"></script>
  <script src="./v3-thinking-a.js"></script>
  <script src="./v3-thinking-b.js"></script>
</body>
</html>
