<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="DeskKit：不登录、不上传、打开即用的日常效率工具箱。PDF、图片、文本、计算、数据与开发工具尽量在浏览器本地完成。" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>DeskKit · 日常效率工具箱</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="DeskKit 首页">
        <span class="brand-mark">D</span>
        <span>
          <strong>DeskKit</strong>
          <small>日常效率工具箱</small>
        </span>
      </a>
      <div class="top-actions">
        <button id="recentBtn" class="ghost-btn" type="button">↻ 最近使用</button>
        <button id="favoritesBtn" class="ghost-btn" type="button">★ 我的收藏</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">◐</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">LOCAL-FIRST · NO LOGIN · OPEN AND USE</p>
        <h1>少开几个网站，<br />少浪费几分钟。</h1>
        <p class="hero-copy">PDF、图片、文本、日期、计算和数据处理，都收进一个干净的工作台。文件与文字尽量只在你的浏览器里处理，不主动上传。</p>

        <div class="trust-row" aria-label="产品特点">
          <span>✓ 不用注册</span>
          <span>✓ 本地优先</span>
          <span>✓ 免费开源</span>
          <span id="heroToolCount">— 个工具</span>
        </div>

        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索：PDF、压缩、日期、百分比、二维码、JSON…" autocomplete="off" />
          <kbd>/</kbd>
        </div>

        <div id="categoryTabs" class="chips" aria-label="工具分类"></div>
      </section>

      <section class="workspace">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TOOL LIBRARY</p>
            <h2 id="sectionTitle">全部工具</h2>
          </div>
          <span id="resultCount" class="result-count"></span>
        </div>

        <div id="toolGrid" class="tool-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div>⌕</div>
          <h3>没有找到匹配的工具</h3>
          <p>换个关键词试试，或者切回“全部”。</p>
        </div>
      </section>
    </main>

    <footer>
      <span>DeskKit · 开源日常效率工具箱</span>
      <span>敏感内容建议优先使用标注为“本地处理”的工具</span>
    </footer>
  </div>

  <dialog id="toolDialog">
    <div class="dialog-shell">
      <div class="dialog-head">
        <div>
          <span id="dialogIcon" class="tool-icon"></span>
          <div>
            <div class="dialog-title-row"><h2 id="dialogTitle"></h2><span id="dialogLocalBadge" class="local-badge">本地处理</span></div>
            <p id="dialogDesc"></p>
          </div>
        </div>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="toolMount" class="tool-mount"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
  <script src="./v2-core.js"></script>
  <script src="./v2-media.js"></script>
</body>
</html>
