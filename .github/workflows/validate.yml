name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check cloud-public.js
          node --check cloud-config.js
          node --check sync.js
          node --check account-lifecycle.js
          node --check cloud-diagnostics.js
          node --check tools-focus.js
          node --check tools-thinking.js
          node --check tasks.js
          node --check horizons.js
          node --check calibration.js
          node --check pwa.js
          node --check capture.js
          node --check sw.js
      - name: Run smoke checks
        run: |
          node tests/smoke.mjs
          node tests/pwa.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts