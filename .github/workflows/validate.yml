name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check tools-focus.js
          node --check tools-thinking.js
      - name: Run smoke checks
        run: node tests/smoke.mjs
