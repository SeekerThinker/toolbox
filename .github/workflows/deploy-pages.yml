name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PUBLISHABLE_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public auth configuration
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          EMAIL_OTP_ENABLED: ${{ vars.EMAIL_OTP_ENABLED }}
          WECHAT_PROVIDER: ${{ vars.WECHAT_PROVIDER }}
          ACCOUNT_DELETION_ENABLED: ${{ vars.ACCOUNT_DELETION_ENABLED }}
        run: |
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_" >&2; exit 1 ;;
          esac
          if [ -n "$WECHAT_PROVIDER" ]; then
            case "$WECHAT_PROVIDER" in
              custom:*) ;;
              *) echo "WECHAT_PROVIDER must be empty or start with custom:" >&2; exit 1 ;;
            esac
          fi
          for value in "$EMAIL_OTP_ENABLED" "$ACCOUNT_DELETION_ENABLED"; do
            if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "Boolean feature variables must be true, false, or empty" >&2
              exit 1
            fi
          done

      - name: Build static site with public auth config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          EMAIL_OTP_ENABLED: ${{ vars.EMAIL_OTP_ENABLED }}
          WECHAT_PROVIDER: ${{ vars.WECHAT_PROVIDER }}
          ACCOUNT_DELETION_ENABLED: ${{ vars.ACCOUNT_DELETION_ENABLED }}
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'supabase/' \
            --exclude 'tests/' \
            ./ _site/
          node <<'NODE'
          const fs = require('node:fs');
          const key = process.env.SUPABASE_PUBLISHABLE_KEY || '';
          const emailOtp = process.env.EMAIL_OTP_ENABLED === 'true';
          const wechat = process.env.WECHAT_PROVIDER || '';
          const accountDeletion = process.env.ACCOUNT_DELETION_ENABLED === 'true';
          const js = `(() => {\n  "use strict";\n  window.ToolboxPublicCloudConfig = Object.freeze({\n    publishableKey: ${JSON.stringify(key)},\n    emailOtp: ${emailOtp},\n    wechatProvider: ${JSON.stringify(wechat)},\n    accountDeletionEnabled: ${accountDeletion}\n  });\n})();\n`;
          fs.writeFileSync('_site/cloud-public.js', js);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
